# iOS build on a free GitHub Mac. Generated by skydrop (https://github.com/Stephy020/skydrop).
#
# This builds an UNSIGNED .ipa, so it needs no Apple Developer account or certificates.
# `skydrop install` signs it on your own PC with your free Apple ID.
#
# Start it with `skydrop build release|dev`, or on GitHub: Actions > iOS build > Run workflow.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "release = standalone app; dev = Expo development build (loads JS from `npx expo start`)"
        type: choice
        options: [release, dev]
        default: release

concurrency:
  group: ios-build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PROFILE: ${{ inputs.profile }}
      CI: "1"
      # Optional overrides:
      IOS_SCHEME: ""      # Xcode scheme to build; empty = auto-detect
      IOS_XCODE: ""       # e.g. "26.6" to use /Applications/Xcode_26.6.app; empty = the runner's default
      NODE_VERSION: "22"  # used when the project has no .nvmrc
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Select Xcode
        if: env.IOS_XCODE != ''
        run: sudo xcode-select -s "/Applications/Xcode_${IOS_XCODE}.app"

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          pod --version

      - name: Pick Node.js version
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d ' \r\n' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Set up Bun
        if: hashFiles('bun.lock', 'bun.lockb') != ''
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      - name: Check dev build requirements
        if: inputs.profile == 'dev'
        run: |
          node -e '
            const p = require("./package.json");
            const deps = { ...p.dependencies, ...p.devDependencies };
            if (!deps["expo-dev-client"]) {
              console.log("::error::A dev build needs expo-dev-client. On your PC run: npx expo install expo-dev-client, commit, and build again.");
              process.exit(1);
            }'

      - name: Generate the native iOS project
        run: |
          if [ -d ios ]; then
            echo "The repo has an ios/ folder; using it as-is."
          else
            npx expo prebuild --platform ios --no-install
          fi

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lock', 'bun.lockb') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          POD="pod"
          if [ -f "$GITHUB_WORKSPACE/Gemfile" ] && grep -qi cocoapods "$GITHUB_WORKSPACE/Gemfile"; then
            export BUNDLE_GEMFILE="$GITHUB_WORKSPACE/Gemfile"
            bundle config set --local path "$GITHUB_WORKSPACE/vendor/bundle"
            bundle install
            POD="bundle exec pod"
          fi
          for attempt in 1 2 3; do
            $POD install && exit 0
            echo "pod install failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n1)
          SCHEME="$IOS_SCHEME"
          if [ -z "$SCHEME" ]; then
            SCHEME=$(basename "$(find ios -maxdepth 1 -name '*.xcodeproj' | head -n1)" .xcodeproj)
          fi
          CONFIGURATION=Release
          if [ "$PROFILE" = dev ]; then CONFIGURATION=Debug; fi
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME | Configuration: $CONFIGURATION"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "CONFIGURATION=$CONFIGURATION" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | \
            if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi

      - name: Package the .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/${CONFIGURATION}-iphoneos" -maxdepth 1 -name '*.app' | head -n1)
          echo "App bundle: $APP"
          NAME="${SCHEME}-${PROFILE}"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/$NAME.ipa" Payload)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" > "out/$NAME.bundle-id"
          ls -lh out
          {
            echo "### iOS $PROFILE build ready"
            echo "Bundle ID: \`$(cat "out/$NAME.bundle-id")\`. Install it with \`skydrop install\` after \`skydrop wait $GITHUB_RUN_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.profile }}
          path: out/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ inputs.profile }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
