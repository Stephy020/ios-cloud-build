# Tests ios-cloud on real Windows (Git Bash) and Linux machines.
# Everything except the final USB install to an iPhone is exercised.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  toolkit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows
    env:
      GH_TOKEN: ${{ github.token }}
      SAMPLE_REPO: Stephy020/MyExpoApp # a public app repo with a recent successful iOS build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Environment
        run: |
          uname -a
          echo "HOME=$HOME"
          echo "TERM_PROGRAM=${TERM_PROGRAM:-<unset>}"
          bash --version | head -n1
          for t in git node npm gh cygpath winpty cmp mktemp du seq sed grep find; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          git config --global user.name "ios-cloud test"
          git config --global user.email "test@example.com"

      - name: install.sh
        run: ./install.sh

      - name: A new terminal finds ios-cloud
        run: |
          # Git Bash opens an interactive login shell; ~/.bashrc must put the shim on PATH.
          bash -lic 'command -v ios-cloud && ios-cloud version'

      - name: doctor
        run: |
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          ios-cloud doctor || echo "(doctor reported problems; expected here: no Apple installer and a CI token)"

      - name: init in a sample Expo project
        run: |
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/sample" && cd "$RUNNER_TEMP/sample"
          echo '{"name":"sample","dependencies":{"expo":"~57.0.0"}}' > package.json
          echo '{"expo":{"name":"Sample","slug":"sample"}}' > app.json
          ios-cloud init --dry-run --no-repo --no-dev-client
          test ! -e .git
          ios-cloud init --no-repo --no-dev-client
          ios-cloud init --no-repo --no-dev-client   # second run must change nothing
          test -f .github/workflows/ios-build.yml
          node -e 'const id = require("./app.json").expo.ios.bundleIdentifier; console.log("bundle id:", id); if (!id) process.exit(1)'
          grep -qx 'build/' .gitignore && grep -qx '/ios' .gitignore
          test "$(git log --oneline | wc -l)" -eq 1
          git status --porcelain | wc -l | grep -qx 0
          if git ls-files --eol | grep -v 'i/lf' | grep -q .; then
            echo "::error::files committed with non-LF endings"; git ls-files --eol; exit 1
          fi

      - name: Download a real build (ios-cloud wait)
        id: download
        run: |
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          run_id=$(gh run list -R "$SAMPLE_REPO" --workflow ios-build.yml --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then echo "::notice::No successful build in $SAMPLE_REPO to download; skipping"; exit 0; fi
          git clone -q "https://github.com/$SAMPLE_REPO" "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          ios-cloud wait "$run_id"
          ls -l build/ios
          ipa=$(cat build/ios/.last)
          test -s "$ipa" && test -s "${ipa%.ipa}.bundle-id"
          unzip -l "$ipa" | grep -q 'Payload/.*\.app/Info.plist'
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: plumesign (Windows installer) runs against the real .ipa
        if: runner.os == 'Windows' && steps.download.outputs.ipa != ''
        run: |
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          url=$(gh api repos/claration/Impactor/releases/latest --jq '.assets[] | select(.name == "plumesign-windows-x86_64.exe") | .browser_download_url')
          curl -fsSL "$url" -o "$HOME/bin/plumesign.exe"
          plumesign --version || true
          plumesign sign --help | head -n 20
          ios-cloud doctor || true
          cd "$RUNNER_TEMP/app"
          # No Apple ID or iPhone here, so this must get as far as "please log in":
          # that proves the .exe ran, got a valid Windows path and unpacked the .ipa.
          IOS_CLOUD_INSTALLER=plumesign ios-cloud install 2>&1 | tee install.log || true
          grep -q "No account selected" install.log
